name: Generate Snake Animation

on:
  # roz raat ko regenerate (naye contributions khane ke liye)
  schedule:
    - cron: "0 0 * * *"
  # manually bhi chala sakte ho (Actions tab -> Run workflow)
  workflow_dispatch:
  # main branch pe push hote hi bhi regenerate
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs (light + dark)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: karandhaodiyal28-hash
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Push SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
